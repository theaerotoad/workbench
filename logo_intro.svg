<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .w-draw {
        stroke-dasharray: 145;
        stroke-dashoffset: 145;
        animation: redrawMark 3.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes redrawMark {
        0% {
          stroke-dashoffset: 145;
          opacity: 0;
        }
        5% {
          opacity: 1;
          stroke-dashoffset: 145;
        }
        48% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        78% {
          stroke-dashoffset: 0;
          opacity: 1;
        }
        90% {
          stroke-dashoffset: 0;
          opacity: 0;
        }
        100% {
          stroke-dashoffset: 145;
          opacity: 0;
        }
      }
    </style>
  </defs>

  <!-- Clean Hexagon Outline -->
  <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" fill="none" stroke="#334155" stroke-width="8" stroke-linejoin="round" />

  <!-- Underlying Faint Ghost Track -->
  <path d="M68 82 L84 120 L100 94 L116 120 L132 82" fill="none" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.15" />

  <!-- Animated Drawing Path -->
  <path pathLength="145" class="w-draw" d="M68 82 L84 120 L100 94 L116 120 L132 82" fill="none" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
</svg>
